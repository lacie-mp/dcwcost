# Netlify build configuration for the DCW Cost Management Astro site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Note: no catch-all 404 redirect here, on purpose.
# Netlify automatically serves the root 404.html (emitted by Astro) for any
# unmatched route, so a rule isn't needed. A `from = "/*"` catch-all also
# intercepts form POSTs and breaks Netlify Forms submissions (the contact
# form was returning the 404 page on submit), so it must not be added back.
